name: Fetch AirCard reference

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Clone AirCard-iOS
        run: |
          set -euo pipefail
          rm -rf /tmp/aircard
          git clone --depth 1 https://github.com/Mak5er/AirCard-iOS.git /tmp/aircard

      - name: Dump to single txt
        run: |
          set -euo pipefail
          SRC=/tmp/aircard
          OUT=reference/aircard_dump.txt
          mkdir -p reference
          : > "$OUT"

          MAX_BYTES=1500000
          TOTAL=0

          echo "================================================================" >> "$OUT"
          echo "AirCard-iOS reference dump" >> "$OUT"
          echo "commit: $(cd "$SRC" && git rev-parse HEAD)" >> "$OUT"
          echo "================================================================" >> "$OUT"
          echo "" >> "$OUT"

          echo "### FILE TREE ###" >> "$OUT"
          (cd "$SRC" && find . -type f -not -path "./.git/*" -not -path "*/target/*" | sort) >> "$OUT"
          echo "" >> "$OUT"

          append_file () {
            local f="$1"
            local rel="$2"
            local size
            size=$(wc -c < "$f" | tr -d ' ')
            if [ $((TOTAL + size)) -gt "$MAX_BYTES" ]; then
              echo "SKIPPED (size limit): $rel" >> "$OUT"
              return
            fi
            TOTAL=$((TOTAL + size))
            echo "================================================================" >> "$OUT"
            echo "FILE: $rel  ($size bytes)" >> "$OUT"
            echo "================================================================" >> "$OUT"
            cat "$f" >> "$OUT"
            echo "" >> "$OUT"
          }

          PRIORITY_EXTS='\.swift$|\.h$|\.m$|\.mm$|\.plist$|\.yml$|\.yaml$|\.entitlements$|\.strings$|\.md$|Cargo\.toml$'

          find "$SRC" -type f \
            -not -path "*/.git/*" \
            -not -path "*/target/*" \
            -not -path "*/build/*" \
            -not -path "*/.build/*" \
            -not -path "*/DerivedData/*" \
            -not -path "*/xcuserdata/*" \
            -not -path "*/node_modules/*" \
            -not -path "*/Pods/*" \
            | grep -E "$PRIORITY_EXTS" \
            | sort \
            | while IFS= read -r f; do
                rel="${f#$SRC/}"
                append_file "$f" "$rel"
              done

          echo "================================================================" >> "$OUT"
          echo "TOTAL BYTES IN DUMP: $TOTAL" >> "$OUT"
          echo "================================================================" >> "$OUT"

          echo "---- final size ----"
          ls -lh "$OUT"
          wc -c "$OUT"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reference/aircard_dump.txt
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Fetch AirCard reference dump [skip ci]"
          git push
